<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>lodj.io · Activities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/search.css">
</head>
<body data-root="../" data-vertical="activities">
  <div class="page">
    <div id="search-topbar"></div>

    <div class="hero-card">
      <div class="panel active" id="activities">
        <div class="grid-activity">
          <div class="field">
            <span class="field-icon">📍</span>
            <input type="text" id="activity-search" placeholder="Search for activities">
          </div>

          <button class="search-btn" type="button" id="searchBtn">Search</button>
        </div>
      </div>
    </div>

    <div id="explore"></div>
  </div>

  <script src="../assets/js/verticals.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../data/destinations.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/autocomplete.js"></script>
  <script src="search.js"></script>
</body>
</html>
