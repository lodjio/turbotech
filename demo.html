<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>lodj.io Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand: #2D34FF;
      --brand-dark: #1c22c7;
      --brand-soft: #e8e9ff;
      --bg: #050505;
      --bg-elevated: #111217;
      --bg-card: rgba(255, 255, 255, 0.08);
      --text: #f4f4f8;
      --text-soft: #b9bed0;
      --text-muted: #8f95a8;
      --border: rgba(255, 255, 255, 0.12);
      --input-bg: rgba(255, 255, 255, 0.06);
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    }

    body.light-mode {
      --bg: #f6f7fb;
      --bg-elevated: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.96);
      --text: #191b22;
      --text-soft: #4f566b;
      --text-muted: #70778b;
      --border: rgba(25, 27, 34, 0.10);
      --input-bg: #f2f4fb;
      --shadow: 0 18px 45px rgba(22, 28, 45, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Comfortaa', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background:
        linear-gradient(rgba(5, 5, 5, 0.55), rgba(5, 5, 5, 0.65)),
        url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=80') center center / cover no-repeat fixed;
    }

    body.light-mode {
      background:
        linear-gradient(rgba(246, 247, 251, 0.72), rgba(246, 247, 251, 0.82)),
        url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=80') center center / cover no-repeat fixed;
    }

    a, button, input, select {
      font-family: 'Comfortaa', sans-serif;
    }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: max(20px, env(safe-area-inset-top)) 16px 40px;
      position: relative;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 28px;
    }

    .brand-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .logo {
      margin: 0;
      color: var(--brand);
      font-size: clamp(2.1rem, 6vw, 3rem);
      font-weight: 700;
      line-height: 1;
    }

    .sub {
      margin: 0;
      color: var(--text-soft);
      font-size: 0.95rem;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .home-link,
    .mode-toggle {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .hero-card,
    .services,
    .section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      position: relative;
      z-index: 5;
    }

    .tab {
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.10);
      color: var(--text);
      padding: 14px 20px;
      border-radius: 16px 16px 0 0;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: var(--bg-card);
      color: var(--brand);
      border-color: var(--border);
    }

    .hero-card {
      padding: 22px;
      position: relative;
      z-index: 20;
      overflow: visible;
    }

    .panel {
      display: none;
      overflow: visible;
    }

    .panel.active {
      display: block;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
      margin-bottom: 18px;
      position: relative;
      z-index: 20;
    }

    .pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .pill.active {
      background: var(--brand-soft);
      color: var(--brand);
      border-color: rgba(45, 52, 255, 0.28);
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-soft);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .check input {
      width: 18px;
      height: 18px;
      accent-color: var(--brand);
    }

    .grid-flight,
    .grid-stay,
    .grid-activity {
      display: grid;
      gap: 12px;
      overflow: visible;
    }

    .grid-flight {
      grid-template-columns: 1.1fr 1.1fr 0.9fr 0.9fr 1fr 150px;
    }

    .grid-stay {
      grid-template-columns: 1.4fr 0.9fr 0.9fr 1fr 150px;
    }

    .grid-activity {
      grid-template-columns: 1fr 150px;
    }

    .field {
      position: relative;
      min-height: 60px;
      display: flex;
      align-items: center;
      padding: 0 16px 0 44px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: visible;
      z-index: 25;
    }

    .field:focus-within {
      z-index: 60;
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--brand);
      font-size: 1rem;
      z-index: 2;
    }

    .field input,
    .field select {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      min-width: 0;
    }

    .field input::placeholder {
      color: var(--text-muted);
      font-weight: 500;
    }

    .search-btn {
      min-height: 60px;
      border: 0;
      border-radius: 14px;
      background: var(--brand);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .search-btn:hover {
      background: var(--brand-dark);
    }

    .services {
      margin-top: 24px;
      padding: 18px 12px;
      position: relative;
      z-index: 1;
    }

    .services-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
    }

    .service {
      text-align: center;
      padding: 12px 6px;
    }

    .service-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 1.3rem;
      font-weight: 700;
    }

    .service-label {
      color: var(--text-soft);
      font-size: 0.82rem;
      line-height: 1.45;
      font-weight: 700;
    }

    .section {
      margin-top: 24px;
      padding: 22px;
      position: relative;
      z-index: 1;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(1.2rem, 4vw, 1.9rem);
      color: var(--text);
    }

    .view-more {
      color: var(--brand);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .dest-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .dest-card {
      position: relative;
      height: 300px;
      border-radius: 18px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      display: block;
    }

    .dest-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dest-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.68), rgba(0,0,0,0.14));
    }

    .dest-name {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      text-align: center;
      z-index: 1;
      font-size: 1rem;
      font-weight: 700;
    }

    .autocomplete-box {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 420px;
      width: max(100%, 420px);
      max-width: min(92vw, 560px);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.42);
      z-index: 9999;
      padding: 8px;
      display: none;
      max-height: 360px;
      overflow-y: auto;
    }

    .autocomplete-box.show {
      display: block;
    }

    .auto-section-title {
      padding: 8px 10px;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .auto-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
    }

    .auto-item:hover {
      background: var(--input-bg);
    }

    .auto-main {
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .auto-sub {
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-top: 3px;
      line-height: 1.55;
      max-width: 360px;
    }

    .auto-tag {
      background: var(--brand-soft);
      color: var(--brand);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
    }

    @media (max-width: 1100px) {
      .grid-flight,
      .grid-stay {
        grid-template-columns: 1fr 1fr;
      }

      .grid-activity {
        grid-template-columns: 1fr;
      }

      .services-row,
      .dest-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .search-btn {
        width: 100%;
      }
    }

    @media (max-width: 700px) {
      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .top-actions {
        justify-content: flex-start;
      }

      .tabs {
        gap: 8px;
      }

      .tab {
        flex: 1 1 auto;
        border-radius: 14px;
        text-align: center;
        padding: 14px 12px;
        font-size: 0.88rem;
      }

      .hero-card {
        padding: 16px;
      }

      .grid-flight,
      .grid-stay,
      .grid-activity,
      .services-row,
      .dest-grid {
        grid-template-columns: 1fr;
      }

      .dest-card {
        height: 260px;
      }

      .filters {
        align-items: flex-start;
      }

      .check {
        font-size: 0.84rem;
      }

      .autocomplete-box {
        left: 0;
        right: 0;
        min-width: 0;
        width: 100%;
        max-width: 100%;
      }

      .auto-sub {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand-wrap">
        <h1 class="logo">lodj.io</h1>
        <p class="sub">Demo experience</p>
      </div>

      <div class="top-actions">
        <a class="home-link" href="index.html">← Back to home</a>
        <button class="mode-toggle" id="modeToggle" type="button">Toggle mode</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="flights">✈ Flights</button>
      <button class="tab" data-tab="stays">🛏 Stays</button>
      <button class="tab" data-tab="activities">🎈 Activities</button>
    </div>

    <div class="hero-card">
      <div class="panel active" id="flights">
        <div class="filters">
          <div class="pills">
            <button class="pill active">One Way</button>
            <button class="pill">Round Trip</button>
            <button class="pill">Multi City</button>
          </div>

          <label class="check">
            <input type="checkbox">
            <span>Direct Flights</span>
          </label>

          <label class="check">
            <input type="checkbox">
            <span>Baggage Included</span>
          </label>
        </div>

        <div class="grid-flight">
          <div class="field">
            <span class="field-icon">🛫</span>
            <input type="text" id="flight-origin" placeholder="Origin" autocomplete="off">
            <div class="autocomplete-box" id="flight-origin-box"></div>
          </div>

          <div class="field">
            <span class="field-icon">🛬</span>
            <input type="text" id="flight-destination" placeholder="Destination" autocomplete="off">
            <div class="autocomplete-box" id="flight-destination-box"></div>
          </div>

          <label class="field">
            <span class="field-icon">📅</span>
            <input type="date" id="flight-start">
          </label>

          <label class="field">
            <span class="field-icon">📅</span>
            <input type="date" id="flight-end">
          </label>

          <div class="field">
            <span class="field-icon">👥</span>
            <select id="flight-pax">
              <option>1 Traveler, Economy</option>
              <option>2 Travelers, Economy</option>
              <option>1 Traveler, Business</option>
              <option>2 Travelers, Business</option>
            </select>
          </div>

          <button class="search-btn" type="button" onclick="goResults('flights')">Search</button>
        </div>
      </div>

      <div class="panel" id="stays">
        <div class="grid-stay">
          <div class="field">
            <span class="field-icon">📍</span>
            <input type="text" id="stay-search" placeholder="Search for properties or places" autocomplete="off">
            <div class="autocomplete-box" id="stay-search-box"></div>
          </div>

          <label class="field">
            <span class="field-icon">📅</span>
            <input type="date" id="stay-start">
          </label>

          <label class="field">
            <span class="field-icon">📅</span>
            <input type="date" id="stay-end">
          </label>

          <div class="field">
            <span class="field-icon">👥</span>
            <select id="stay-pax">
              <option>1 Room, 2 Adults, 0 Child</option>
              <option>2 Rooms, 4 Adults, 0 Child</option>
              <option>1 Room, 2 Adults, 1 Child</option>
            </select>
          </div>

          <button class="search-btn" type="button" onclick="goResults('stays')">Search</button>
        </div>
      </div>

      <div class="panel" id="activities">
        <div class="grid-activity">
          <div class="field">
            <span class="field-icon">📍</span>
            <input type="text" id="activity-search" placeholder="Search for activities">
          </div>

          <button class="search-btn" type="button" onclick="goResults('activities')">Search</button>
        </div>
      </div>
    </div>

    <div class="services">
      <div class="services-row">
        <div class="service"><div class="service-icon">🚐</div><div class="service-label">Transfers</div></div>
        <div class="service"><div class="service-icon">🚆</div><div class="service-label">Haramain Train</div></div>
        <div class="service"><div class="service-icon">🚗</div><div class="service-label">Car rental</div></div>
        <div class="service"><div class="service-icon">🧳</div><div class="service-label">Domestic packages</div></div>
        <div class="service"><div class="service-icon">🛳</div><div class="service-label">Cruise packages</div></div>
        <div class="service"><div class="service-icon">🗺</div><div class="service-label">Packages</div></div>
        <div class="service"><div class="service-icon">•••</div><div class="service-label">More services</div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>Top international escapes</h2>
        <a class="view-more" href="results.html?type=stays">View more</a>
      </div>

      <div class="dest-grid">
        <a class="dest-card" href="results.html?type=stays&to=London"><img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=900&q=80" alt="London"><div class="dest-name">London</div></a>
        <a class="dest-card" href="results.html?type=stays&to=Paris"><img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=900&q=80" alt="Paris"><div class="dest-name">Paris</div></a>
        <a class="dest-card" href="results.html?type=stays&to=Mykonos"><img src="https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=900&q=80" alt="Mykonos"><div class="dest-name">Mykonos</div></a>
        <a class="dest-card" href="results.html?type=stays&to=Hong Kong"><img src="https://images.unsplash.com/photo-1536599018102-9f803c140fc1?auto=format&fit=crop&w=1200&q=80" alt="Hong Kong"><div class="dest-name">Hong Kong</div></a>
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>Top domestic getaways</h2>
        <a class="view-more" href="results.html?type=stays">View more</a>
      </div>

      <div class="dest-grid">
        <a class="dest-card" href="results.html?type=stays&to=Jeddah"><img src="https://images.unsplash.com/photo-1565552645632-d725f8bfc19a?auto=format&fit=crop&w=900&q=80" alt="Jeddah"><div class="dest-name">Jeddah</div></a>
        <a class="dest-card" href="results.html?type=stays&to=Riyadh"><img src="https://images.unsplash.com/photo-1586724237569-f3d0c1dee8c6?auto=format&fit=crop&w=900&q=80" alt="Riyadh"><div class="dest-name">Riyadh</div></a>
        <a class="dest-card" href="results.html?type=stays&to=Red Sea"><img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=900&q=80" alt="Red Sea"><div class="dest-name">Red Sea</div></a>
        <a class="dest-card" href="results.html?type=stays&to=AlUla"><img src="https://images.unsplash.com/photo-1519834785169-98be25ec3f84?auto=format&fit=crop&w=900&q=80" alt="AlUla"><div class="dest-name">AlUla</div></a>
      </div>
    </div>
  </div>

  <script>
    const AIRPORTS = [
      { code: 'JED', city: 'Jeddah', airport: 'King Abdulaziz International Airport', country: 'Saudi Arabia' },
      { code: 'RUH', city: 'Riyadh', airport: 'King Khalid International Airport', country: 'Saudi Arabia' },
      { code: 'DMM', city: 'Dammam', airport: 'King Fahd International Airport', country: 'Saudi Arabia' },
      { code: 'DXB', city: 'Dubai', airport: 'Dubai International Airport', country: 'UAE' },
      { code: 'AUH', city: 'Abu Dhabi', airport: 'Zayed International Airport', country: 'UAE' },
      { code: 'DOH', city: 'Doha', airport: 'Hamad International Airport', country: 'Qatar' },
      { code: 'BAH', city: 'Bahrain', airport: 'Bahrain International Airport', country: 'Bahrain' },
      { code: 'KWI', city: 'Kuwait City', airport: 'Kuwait International Airport', country: 'Kuwait' },
      { code: 'MCT', city: 'Muscat', airport: 'Muscat International Airport', country: 'Oman' },
      { code: 'LHR', city: 'London', airport: 'Heathrow Airport', country: 'United Kingdom' },
      { code: 'CDG', city: 'Paris', airport: 'Charles de Gaulle Airport', country: 'France' },
      { code: 'HKG', city: 'Hong Kong', airport: 'Hong Kong International Airport', country: 'Hong Kong' },
      { code: 'BKK', city: 'Bangkok', airport: 'Suvarnabhumi Airport', country: 'Thailand' },
      { code: 'HKT', city: 'Phuket', airport: 'Phuket International Airport', country: 'Thailand' },
      { code: 'KBV', city: 'Krabi', airport: 'Krabi International Airport', country: 'Thailand' },
      { code: 'JMK', city: 'Mykonos', airport: 'Mykonos Airport', country: 'Greece' },
      { code: 'IST', city: 'Istanbul', airport: 'Istanbul Airport', country: 'Turkey' },
      { code: 'MLE', city: 'Malé', airport: 'Velana International Airport', country: 'Maldives' }
    ];

    const DESTINATIONS = [
      { name: 'Jeddah', country: 'Saudi Arabia', tag: 'Trending' },
      { name: 'Mykonos', country: 'Greece', tag: 'Sponsored' },
      { name: 'Phuket', country: 'Thailand', tag: 'Trending' },
      { name: 'Krabi', country: 'Thailand', tag: 'Trending' },
      { name: 'Hong Kong', country: 'Hong Kong', tag: 'Sponsored' },
      { name: 'Red Sea', country: 'Saudi Arabia', tag: 'Sponsored' },
      { name: 'AlUla', country: 'Saudi Arabia', tag: 'Trending' },
      { name: 'Riyadh', country: 'Saudi Arabia', tag: 'Popular' },
      { name: 'Dubai', country: 'UAE', tag: 'Popular' },
      { name: 'Istanbul', country: 'Turkey', tag: 'Popular' },
      { name: 'London', country: 'United Kingdom', tag: 'Popular' },
      { name: 'Paris', country: 'France', tag: 'Popular' }
    ];

    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.panel');
    const pills = document.querySelectorAll('.pill');
    const modeToggle = document.getElementById('modeToggle');

    function applyTheme(theme) {
      if (theme === 'light') document.body.classList.add('light-mode');
      else document.body.classList.remove('light-mode');
      localStorage.setItem('lodj-theme', theme);
    }

    applyTheme(localStorage.getItem('lodj-theme') || 'dark');

    modeToggle.addEventListener('click', () => {
      applyTheme(document.body.classList.contains('light-mode') ? 'dark' : 'light');
    });

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        panels.forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
      });
    });

    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        pill.parentElement.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
      });
    });

    function renderAirportSuggestions(inputEl, boxEl, query) {
      const q = query.trim().toLowerCase();
      let matches = AIRPORTS.filter(a =>
        a.code.toLowerCase().includes(q) ||
        a.city.toLowerCase().includes(q) ||
        a.airport.toLowerCase().includes(q) ||
        a.country.toLowerCase().includes(q)
      );

      if (!q) matches = AIRPORTS.slice(0, 8);
      else matches = matches.slice(0, 8);

      boxEl.innerHTML = `
        <div class="auto-section-title">Airports</div>
        ${matches.map(a => `
          <div class="auto-item" data-value="${a.code} - ${a.city}">
            <div>
              <div class="auto-main">${a.code} - ${a.city}</div>
              <div class="auto-sub">${a.airport}, ${a.country}</div>
            </div>
            <div class="auto-tag">Airport</div>
          </div>
        `).join('')}
      `;
      boxEl.classList.add('show');

      boxEl.querySelectorAll('.auto-item').forEach(item => {
        item.addEventListener('click', () => {
          inputEl.value = item.dataset.value;
          boxEl.classList.remove('show');
        });
      });
    }

    function renderDestinationSuggestions(inputEl, boxEl, query) {
      const q = query.trim().toLowerCase();
      const trending = DESTINATIONS.filter(d => ['Trending', 'Sponsored'].includes(d.tag));
      const matches = DESTINATIONS.filter(d =>
        d.name.toLowerCase().includes(q) || d.country.toLowerCase().includes(q)
      );

      if (!q) {
        boxEl.innerHTML = `
          <div class="auto-section-title">Trending searches</div>
          ${trending.map(d => `
            <div class="auto-item" data-value="${d.name}, ${d.country}">
              <div>
                <div class="auto-main">${d.name}</div>
                <div class="auto-sub">${d.country}</div>
              </div>
              <div class="auto-tag">${d.tag}</div>
            </div>
          `).join('')}
        `;
      } else {
        boxEl.innerHTML = `
          <div class="auto-section-title">Destinations</div>
          ${matches.slice(0, 8).map(d => `
            <div class="auto-item" data-value="${d.name}, ${d.country}">
              <div>
                <div class="auto-main">${d.name}</div>
                <div class="auto-sub">${d.country}</div>
              </div>
              <div class="auto-tag">${d.tag}</div>
            </div>
          `).join('')}
        `;
      }

      boxEl.classList.add('show');

      boxEl.querySelectorAll('.auto-item').forEach(item => {
        item.addEventListener('click', () => {
          inputEl.value = item.dataset.value;
          boxEl.classList.remove('show');
        });
      });
    }

    const flightOrigin = document.getElementById('flight-origin');
    const flightOriginBox = document.getElementById('flight-origin-box');
    const flightDestination = document.getElementById('flight-destination');
    const flightDestinationBox = document.getElementById('flight-destination-box');
    const staySearch = document.getElementById('stay-search');
    const staySearchBox = document.getElementById('stay-search-box');

    flightOrigin.addEventListener('focus', () => renderAirportSuggestions(flightOrigin, flightOriginBox, flightOrigin.value));
    flightOrigin.addEventListener('input', () => renderAirportSuggestions(flightOrigin, flightOriginBox, flightOrigin.value));
    flightDestination.addEventListener('focus', () => renderAirportSuggestions(flightDestination, flightDestinationBox, flightDestination.value));
    flightDestination.addEventListener('input', () => renderAirportSuggestions(flightDestination, flightDestinationBox, flightDestination.value));
    staySearch.addEventListener('focus', () => renderDestinationSuggestions(staySearch, staySearchBox, staySearch.value));
    staySearch.addEventListener('input', () => renderDestinationSuggestions(staySearch, staySearchBox, staySearch.value));

    document.addEventListener('click', (e) => {
      if (!flightOrigin.parentElement.contains(e.target)) flightOriginBox.classList.remove('show');
      if (!flightDestination.parentElement.contains(e.target)) flightDestinationBox.classList.remove('show');
      if (!staySearch.parentElement.contains(e.target)) staySearchBox.classList.remove('show');
    });

    function goResults(type) {
      const params = new URLSearchParams();
      params.set('type', type);

      if (type === 'flights') {
        params.set('from', flightOrigin.value || 'JED');
        params.set('to', flightDestination.value || 'DXB');
        params.set('start', document.getElementById('flight-start').value || '');
        params.set('end', document.getElementById('flight-end').value || '');
        params.set('pax', document.getElementById('flight-pax').value || '1 Traveler, Economy');
      }

      if (type === 'stays') {
        params.set('to', staySearch.value || 'Dubai');
        params.set('start', document.getElementById('stay-start').value || '');
        params.set('end', document.getElementById('stay-end').value || '');
        params.set('pax', document.getElementById('stay-pax').value || '1 Room, 2 Adults, 0 Child');
      }

      if (type === 'activities') {
        params.set('to', document.getElementById('activity-search').value || 'Dubai');
      }

      window.location.href = `results.html?${params.toString()}`;
    }
  </script>
</body>
</html>
