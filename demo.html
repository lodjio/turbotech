<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lodj.io Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background:
        linear-gradient(rgba(7, 20, 35, 0.25), rgba(7, 20, 35, 0.25)),
        url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=80') center center / cover no-repeat fixed;
      min-height: 100vh;
      color: #17354b;
    }

    .topbar {
      padding: 24px 20px 10px;
      text-align: center;
    }

    .logo {
      margin: 0;
      font-family: 'Comfortaa', sans-serif;
      font-size: 2rem;
      color: #ffffff;
    }

    .sub {
      margin: 8px 0 0;
      color: rgba(255,255,255,0.88);
      font-size: 0.95rem;
    }

    .wrap {
      max-width: 1280px;
      margin: 28px auto 50px;
      padding: 0 16px;
    }

    .tabs {
      display: flex;
      gap: 2px;
      align-items: end;
    }

    .tab {
      border: 0;
      padding: 18px 28px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: rgba(14, 87, 117, 0.92);
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }

    .tab:not(.active) {
      background: rgba(61, 79, 110, 0.92);
    }

    .tab.active {
      background: #f2f2f2;
      color: #14364b;
    }

    .card {
      background: #f2f2f2;
      border-radius: 0 12px 12px 12px;
      padding: 22px 22px 26px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.18);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 18px;
      margin-bottom: 18px;
    }

    .pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      border: 1px solid #c7d0d9;
      background: #fff;
      color: #1b3447;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .pill.active {
      background: #dff3fb;
      color: #0f86b8;
      border-color: #8bc8e5;
      font-weight: 600;
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 1rem;
      color: #334c60;
    }

    .check input {
      width: 20px;
      height: 20px;
      accent-color: #1a95cb;
    }

    .grid-flight,
    .grid-stay,
    .grid-activity {
      display: grid;
      gap: 10px;
      align-items: stretch;
    }

    .grid-flight {
      grid-template-columns: 1.2fr 1.2fr 1fr 1fr 1.2fr auto;
    }

    .grid-stay {
      grid-template-columns: 1.4fr 0.9fr 0.9fr 1.1fr auto;
    }

    .grid-activity {
      grid-template-columns: 1fr auto;
    }

    .field {
      position: relative;
      background: #fff;
      border: 1px solid #cad3da;
      border-radius: 4px;
      min-height: 58px;
      display: flex;
      align-items: center;
      padding: 0 16px 0 44px;
      overflow: visible;
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #93a6b6;
      font-size: 1.05rem;
      z-index: 2;
    }

    .field input,
    .field select {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 1rem;
      color: #1f3344;
      font-family: 'Inter', sans-serif;
    }

    .field input::placeholder {
      color: #a8b3bd;
    }

    .search-btn {
      border: 0;
      border-radius: 4px;
      background: #f04b58;
      color: #fff;
      padding: 0 28px;
      min-height: 58px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .services {
      background: rgba(255,255,255,0.96);
      margin-top: 26px;
      border-radius: 12px;
      padding: 20px 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.10);
    }

    .services-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
      text-align: center;
    }

    .service {
      padding: 12px 8px;
      border-right: 1px solid #e2e7ec;
    }

    .service:last-child {
      border-right: 0;
    }

    .service-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e9f7fd;
      color: #0f85b8;
      font-size: 1.35rem;
    }

    .service-label {
      font-size: 0.95rem;
      color: #23384b;
      font-weight: 500;
    }

    .section {
      background: rgba(255,255,255,0.96);
      margin-top: 26px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.10);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 2rem;
      color: #1f3344;
      font-weight: 600;
    }

    .view-more {
      color: #1ea3d2;
      text-decoration: none;
      font-weight: 600;
    }

    .dest-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .dest-card {
      position: relative;
      height: 360px;
      border-radius: 18px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      background: #ccc;
    }

    .dest-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dest-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.58), rgba(0,0,0,0.10));
    }

    .dest-name {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      text-align: center;
      z-index: 1;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .back-link {
      display: inline-block;
      margin-top: 18px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }

    .autocomplete-box {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #d5dde4;
      border-radius: 12px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.16);
      z-index: 30;
      padding: 10px;
      display: none;
      max-height: 360px;
      overflow-y: auto;
    }

    .autocomplete-box.show {
      display: block;
    }

    .auto-section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #7d93a4;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 8px 10px 6px;
    }

    .auto-item {
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .auto-item:hover {
      background: #f3f8fb;
    }

    .auto-main {
      font-size: 0.96rem;
      color: #1f3344;
      font-weight: 600;
    }

    .auto-sub {
      font-size: 0.86rem;
      color: #748b9d;
      margin-top: 2px;
    }

    .auto-tag {
      font-size: 0.76rem;
      font-weight: 700;
      color: #fff;
      background: #18a0d1;
      border-radius: 999px;
      padding: 6px 9px;
      white-space: nowrap;
    }

    @media (max-width: 1100px) {
      .grid-flight,
      .grid-stay {
        grid-template-columns: 1fr 1fr;
      }

      .grid-activity {
        grid-template-columns: 1fr;
      }

      .search-btn {
        width: 100%;
      }

      .services-row,
      .dest-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .tabs {
        flex-wrap: wrap;
        gap: 8px;
      }

      .tab {
        border-radius: 10px;
      }

      .card {
        border-radius: 12px;
      }

      .grid-flight,
      .grid-stay,
      .grid-activity,
      .services-row,
      .dest-grid {
        grid-template-columns: 1fr;
      }

      .section-head h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
