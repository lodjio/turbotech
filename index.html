<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lodj.io</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background:
        linear-gradient(rgba(10, 27, 44, 0.25), rgba(10, 27, 44, 0.25)),
        url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80') center center / cover no-repeat;
      min-height: 100vh;
      color: #163047;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 20px 10px;
      text-align: center;
    }

    .logo {
      margin: 0;
      font-family: 'Comfortaa', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .tagline {
      margin: 12px 0 0;
      color: rgba(255, 255, 255, 0.92);
      font-size: 1rem;
      font-weight: 500;
    }

    main {
      width: 100%;
      padding: 32px 14px 60px;
      display: flex;
      justify-content: center;
    }

    .search-shell {
      width: 100%;
      max-width: 1240px;
    }

    .top-tabs {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      margin-bottom: 0;
      padding-left: 18px;
    }

    .top-tab {
      border: 0;
      background: rgba(16, 85, 116, 0.88);
      color: #ffffff;
      padding: 16px 28px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      transition: background 0.2s ease;
    }

    .top-tab:hover {
      background: rgba(20, 98, 132, 0.95);
    }

    .top-tab.active {
      background: #f7f7f7;
      color: #15344b;
    }

    .search-card {
      background: #f7f7f7;
      border-radius: 14px;
      padding: 18px 18px 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
    }

    .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 18px;
      align-items: center;
      margin-bottom: 18px;
      padding: 2px 4px 10px;
    }

    .pill-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      border: 1px solid #c9d3dc;
      background: #ffffff;
      color: #1b3447;
      border-radius: 999px;
      padding: 10px 15px;
      font-size: 0.96rem;
      line-height: 1;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill:hover {
      border-color: #8bc9e7;
    }

    .pill.active {
      background: #dff4fd;
      border-color: #89cce8;
      color: #1081b3;
      font-weight: 600;
    }

    .check-option {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 1rem;
      color: #334e63;
      cursor: pointer;
      user-select: none;
    }

    .check-option input {
      width: 20px;
      height: 20px;
      accent-color: #1d9ad0;
      cursor: pointer;
    }

    .search-grid {
      display: grid;
      grid-template-columns: 1.3fr 1.3fr 1.1fr 1.1fr 1.25fr auto;
      gap: 8px;
      align-items: stretch;
    }

    .field {
      position: relative;
      background: #ffffff;
      border: 1px solid #d1d9e0;
      border-radius: 4px;
      min-height: 58px;
      display: flex;
      align-items: center;
      padding: 0 16px 0 46px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field:hover,
    .field:focus-within {
      border-color: #77c6e7;
      box-shadow: 0 0 0 3px rgba(119, 198, 231, 0.15);
    }

    .field-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: #92a5b5;
      pointer-events: none;
    }

    .field input,
    .field select {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 1rem;
      color: #1f3344;
      font-family: 'Inter', sans-serif;
    }

    .field input::placeholder {
      color: #a5b2bd;
    }

    .search-btn {
      border: 0;
      border-radius: 4px;
      background: #ef4d5a;
      color: #ffffff;
      padding: 0 24px;
      min-height: 58px;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    .search-btn:hover {
      background: #e63e4c;
      transform: translateY(-1px);
    }

    .footer-note {
      margin-top: 22px;
      text-align: center;
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.95rem;
    }

    .fake-result {
      margin-top: 18px;
      text-align: center;
      color: #33556d;
      font-size: 0.95rem;
      display: none;
    }

    .fake-result.show {
      display: block;
    }

    @media (max-width: 1100px) {
      .search-grid {
        grid-template-columns: 1fr 1fr;
      }

      .search-btn {
        width: 100%;
      }
    }

    @media (max-width: 700px) {
      .top-tabs {
        padding-left: 0;
        flex-wrap: wrap;
        gap: 8px;
      }

      .top-tab {
        border-radius: 10px;
        width: auto;
      }

      .search-card {
        padding: 16px;
      }

      .filters-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .search-grid {
        grid-template-columns: 1fr;
      }

      .logo {
        font-size: 1.7rem;
      }

      .tagline {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1 class="logo">lodj.io</h1>
    <p class="tagline">Travel supply rebuilt from the ground up</p>
  </header>

  <main>
    <div class="search-shell">
      <div class="top-tabs">
        <button class="top-tab active" type="button">✈ Flights</button>
        <button class="top-tab" type="button">🛏 Stays</button>
        <button class="top-tab" type="button">🎈 Activities</button>
      </div>

      <div class="search-card">
        <div class="filters-row">
          <div class="pill-group">
            <button class="pill" type="button">One Way</button>
            <button class="pill active" type="button">Round Trip</button>
            <button class="pill" type="button">Multi City</button>
          </div>

          <label class="check-option">
            <input type="checkbox">
            <span>Direct Flights</span>
          </label>

          <label class="check-option">
            <input type="checkbox">
            <span>Included Baggage</span>
          </label>
        </div>

        <div class="search-grid">
          <div class="field">
            <span class="field-icon">🛫</span>
            <input type="text" placeholder="Origin" value="">
          </div>

          <div class="field">
            <span class="field-icon">🛬</span>
            <input type="text" placeholder="Destination" value="">
          </div>

          <label class="field">
            <span class="field-icon">📅</span>
            <input type="date" value="2026-03-29">
          </label>

          <label class="field">
            <span class="field-icon">📅</span>
            <input type="date" value="2026-03-30">
          </label>

          <div class="field">
            <span class="field-icon">👥</span>
            <select>
              <option>1 Traveler, Economy</option>
              <option>2 Travelers, Economy</option>
              <option>1 Traveler, Business</option>
              <option>2 Travelers, Business</option>
            </select>
          </div>

          <button class="search-btn" type="button" id="searchBtn">Search</button>
        </div>

        <div class="fake-result" id="fakeResult">
          Demo mode only. Search UI is live, booking engine still cooking.
        </div>
      </div>

      <div class="footer-note">
        Mock interface for demonstration purposes
      </div>
    </div>
  </main>

  <script>
    const topTabs = document.querySelectorAll('.top-tab');
    const pills = document.querySelectorAll('.pill');
    const searchBtn = document.getElementById('searchBtn');
    const fakeResult = document.getElementById('fakeResult');

    topTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        topTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });

    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        pills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
      });
    });

    searchBtn.addEventListener('click', () => {
      fakeResult.classList.add('show');
    });
  </script>
</body>
</html>
