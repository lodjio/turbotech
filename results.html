<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>lodj.io Results</title>
  <!-- Old results URL (results.html?type=...): forwards to the vertical's own results page. -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var type = (params.get('type') || 'stays').toLowerCase();
      var path = { flights: 'flights', stays: 'hotels', hotels: 'hotels', holidays: 'holidays', activities: 'activities' }[type] || 'hotels';
      params.delete('type');
      var qs = params.toString();
      window.location.replace(path + '/results.html' + (qs ? '?' + qs : ''));
    })();
  </script>
</head>
<body>
  <p>Redirecting… <a href="hotels/results.html">Continue</a></p>
</body>
</html>
